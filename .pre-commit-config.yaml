# Checks that run on `git commit` once installed: `uv run --directory backend pre-commit install`.
# Run everything by hand: `uv run --directory backend pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  # Keep in step with the ruff version in backend/uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: uv run --directory backend mypy
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
      - id: tsc
        name: tsc (frontend)
        entry: npm --prefix frontend run typecheck
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
