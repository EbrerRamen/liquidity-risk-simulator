[project]
name = "lrs-backend"
version = "0.1.0"
description = "Liquidity Risk Simulator API: FastAPI, SQLAlchemy and the financial engines."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.uv]
# An application, not a library: run in place, never built or installed.
package = false

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # import order
  "N",            # naming
  "UP",           # modern syntax
  "B",            # likely bugs
  "C4",           # comprehensions
  "SIM",          # simplifications
  "DTZ",          # timezone-naive datetimes: timestamps are always aware
  "PT",           # pytest style
  "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["integration: needs the test PostgreSQL database (TEST_DATABASE_URL)"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
